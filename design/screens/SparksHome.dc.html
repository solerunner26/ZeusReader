<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sparks — saved passages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Literata:ital,opsz,wght@1,7..72,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
@keyframes tw{0%,100%{opacity:.55;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:linear-gradient(165deg,#120B2E,#2A1470);color:#F4F1FF;font-family:'Bricolage Grotesque',sans-serif">
<div aria-hidden="true" style="position:absolute;width:300px;height:300px;right:-120px;top:-80px;border-radius:50%;background:#FF4FD8;filter:blur(90px);opacity:0.45"></div>
<div style="position:relative;padding:20px 18px 0;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:center;gap:10px">
<h1 style="margin:0;flex:1;font-family:'Unbounded',sans-serif;font-weight:900;font-size:36px">Sparks</h1>
<span style="height:34px;padding:0 12px;border-radius:12px;background:#FFE14D;color:#120B2E;font-weight:800;font-size:14px;line-height:34px;transform:rotate(4deg)">{{count}}</span>
<button aria-label="Search sparks" style="width:48px;height:48px;border-radius:24px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.08);color:#F4F1FF;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></button>
</div>

<div role="group" aria-label="Your constellations" style="position:relative;height:200px;border-radius:30px;background:radial-gradient(120% 100% at 30% 20%,#2C1A6B,#0C0722);border:1px solid rgba(255,255,255,0.15);overflow:hidden">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="14"><span aria-hidden="true" style="position:absolute;left:{{s.x}};top:{{s.y}};width:{{s.z}};height:{{s.z}};border-radius:50%;background:{{s.c}};box-shadow:0 0 10px {{s.c}};animation:tw {{s.t}} ease-in-out infinite"></span></sc-for>
<span aria-hidden="true" style="position:absolute;left:40px;top:60px;width:70px;height:1px;background:rgba(61,245,208,0.6);transform:rotate(20deg);transform-origin:left"></span>
<span aria-hidden="true" style="position:absolute;left:105px;top:84px;width:56px;height:1px;background:rgba(61,245,208,0.6);transform:rotate(-35deg);transform-origin:left"></span>
<span aria-hidden="true" style="position:absolute;left:220px;top:110px;width:80px;height:1px;background:rgba(255,79,216,0.6);transform:rotate(15deg);transform-origin:left"></span>
<button style="position:absolute;left:24px;top:118px;height:36px;padding:0 12px;border-radius:18px;border:0;background:#3DF5D0;color:#04161A;font:inherit;font-weight:800;font-size:13px">Soil science · 9</button>
<button style="position:absolute;left:200px;top:148px;height:36px;padding:0 12px;border-radius:18px;border:0;background:#FF4FD8;color:#120B2E;font:inherit;font-weight:800;font-size:13px">Post-worthy · 5</button>
<button style="position:absolute;left:180px;top:20px;height:36px;padding:0 12px;border-radius:18px;border:0;background:#FFE14D;color:#120B2E;font:inherit;font-weight:800;font-size:13px">Exam fuel · 14</button>
</div>

<div style="display:flex;flex-direction:column;gap:10px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="3">
<article style="border-radius:24px;padding:14px 8px 10px 16px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.16);display:flex;gap:8px">
<a href="SparkEdit.dc.html" style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">
<span style="font-family:'Literata',serif;font-style:italic;font-size:16px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{it.q}}</span>
<span style="display:flex;gap:6px;align-items:center;font-size:12px;min-width:0"><span style="width:8px;height:8px;border-radius:4px;flex:none;background:{{it.c}};box-shadow:0 0 8px {{it.c}}"></span><span style="opacity:0.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{it.src}}</span></span>
</a>
<div style="display:flex;flex-direction:column">
<a href="CardStudio.dc.html" aria-label="Make a spark card" style="width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#FFE14D"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"></rect><path d="M12 8l1.2 3.3L16.5 12l-3.3 1.2L12 16.5l-1.2-3.3L7.5 12l3.3-.7z" fill="currentColor"></path></svg></a>
<button onClick="{{it.del}}" aria-label="Delete spark" style="width:44px;height:44px;border-radius:22px;border:0;background:transparent;color:rgba(244,241,255,0.7);display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
</div>
</article>
</sc-for>
</div>
</div>

<sc-if value="{{undo}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position:absolute;left:14px;right:14px;bottom:100px;height:56px;border-radius:28px;background:#F4F1FF;color:#120B2E;display:flex;align-items:center;gap:8px;padding:0 6px 0 18px;font-weight:600;font-size:14px"><span style="flex:1">Spark faded away</span><button onClick="{{restore}}" style="height:44px;padding:0 16px;border-radius:22px;border:0;background:#120B2E;color:#FFE14D;font:inherit;font-weight:800;font-size:14px">Bring it back</button></div>
</sc-if>

<nav aria-label="Main" style="position:absolute;left:16px;right:16px;bottom:16px;height:68px;border-radius:34px;background:rgba(18,11,46,0.6);border:1px solid rgba(255,255,255,0.18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0 6px">
<a href="Home.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"></path></svg>Home</a>
<a href="Olympus.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM15.5 5l3.8-1 2.7 15-3.8 1z"></path></svg>Olympus</a>
<a href="SparksHome.dc.html" aria-current="page" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:800;color:#FFE14D"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"></path></svg>Sparks</a>
<a href="Words.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600"><span style="font-family:'Unbounded',sans-serif;font-weight:800;font-size:17px;line-height:22px">अ</span>Words</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { gone:[], last:null }; }
renderVals() {
const all = [
{id:1,q:'“Capillary action draws water upward through narrow soil pores against gravity.”',src:'Soil Science for Beginners · p.84',c:'#3DF5D0'},
{id:2,q:'“Clay holds water close to the roots for longer.”',src:'Soil Science for Beginners · p.85',c:'#FFE14D'},
{id:3,q:'“Every gram of healthy soil is a city of living things.”',src:'Life Underground · p.12',c:'#FF4FD8'}
];
const P = [[40,60,8,'#3DF5D0'],[106,84,10,'#3DF5D0'],[150,52,7,'#3DF5D0'],[220,110,9,'#FF4FD8'],[296,130,8,'#FF4FD8'],[250,40,6,'#FFE14D'],[300,70,9,'#FFE14D'],[330,30,5,'#FFE14D'],[80,20,3,'#FFFFFF'],[180,90,3,'#FFFFFF'],[340,170,3,'#FFFFFF'],[20,170,2,'#FFFFFF'],[130,170,3,'#FFFFFF'],[270,180,2,'#FFFFFF']];
return { count: 32 - this.state.gone.length + ' sparks',
stars: P.map(([x,y,z,c],i) => ({ x:x+'px', y:y+'px', z:z+'px', c, t:(2 + (i % 4) * 0.7) + 's' })),
items: all.filter(x => !this.state.gone.includes(x.id)).map(x => ({ ...x, del: () => this.setState({ gone:[...this.state.gone, x.id], last:x.id }) })),
undo: this.state.last !== null, restore: () => this.setState({ gone: this.state.gone.filter(g => g !== this.state.last), last:null }) };
}
}
</script>
</body>
</html>
