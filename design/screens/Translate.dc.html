<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Translate Lens</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Literata:opsz,wght@7..72,400&family=JetBrains+Mono:wght@400;600&family=Noto+Serif+Devanagari:wght@400&family=Noto+Serif+Gujarati:wght@400&display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes sheen{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:linear-gradient(165deg,#04161A,#0C4A4A);font-family:'Bricolage Grotesque',sans-serif">
<div aria-hidden="true" style="position:absolute;width:320px;height:320px;left:-140px;top:-120px;border-radius:50%;background:#3DF5D0;filter:blur(90px);opacity:0.5"></div>
<div style="position:absolute;left:12px;right:12px;top:22px;display:flex;align-items:center;gap:8px">
<div role="radiogroup" aria-label="Translate mode" style="flex:1;display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2)">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="3"><button role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="flex:1;height:40px;border:0;border-radius:20px;background:{{m.bg}};color:{{m.fg}};font:inherit;font-weight:800;font-size:13px">{{m.l}}</button></sc-for>
</div>
<button onClick="{{flipLang}}" aria-label="Switch language" style="height:48px;padding:0 14px;border-radius:24px;border:0;background:#A6FF4D;color:#04161A;font:inherit;font-weight:800;font-size:15px">{{langLabel}}</button>
</div>

<div style="position:absolute;left:8px;right:8px;top:84px;bottom:8px;border-radius:30px;background:#F6F4FF;color:#17142B;overflow:hidden;padding:26px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px">
<sc-for list="{{paras}}" as="p" hint-placeholder-count="3">
<button onClick="{{p.pick}}" aria-label="Translate this paragraph" style="border:0;background:{{p.lensBg}};padding:{{p.pad}};border-radius:22px;text-align:left;color:#17142B;box-shadow:{{p.ring}};cursor:pointer;display:flex;flex-direction:column;gap:6px">
<sc-if value="{{p.showEn}}" hint-placeholder-val="{{ true }}"><span style="font-family:'Literata',serif;font-size:{{p.enSize}};line-height:1.65;opacity:{{p.enO}}">{{p.en}}</span></sc-if>
<sc-if value="{{p.showTr}}" hint-placeholder-val="{{ false }}"><span lang="{{lang}}" style="font-family:{{trFont}};font-size:18px;line-height:1.85;border-left:{{p.mark}};padding-left:{{p.mpad}}">{{p.tr}}</span></sc-if>
</button>
</sc-for>
<div style="margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:11px;color:#5B5675"><span>tap any paragraph · lens follows</span><span>offline · next 3 pages ready</span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { mode:'lens', at:1, lang:'hi' }; }
renderVals() {
const hi = this.state.lang === 'hi', m = this.state.mode;
const EN = ['Soil is not a solid block but a maze of particles and the spaces between them.','Capillary action draws water upward through narrow soil pores against gravity, supplying plant roots during dry intervals.','The finer the pores, the higher the water climbs.'];
const TR = hi ? ['मिट्टी कोई ठोस खंड नहीं, बल्कि कणों और उनके बीच की जगहों का जाल है।','केशिका क्रिया गुरुत्वाकर्षण के विरुद्ध मिट्टी के संकीर्ण छिद्रों से पानी को ऊपर की ओर खींचती है, जिससे शुष्क अंतराल के दौरान पौधों की जड़ों को पानी मिलता है।','छिद्र जितने महीन होंगे, पानी उतना ही ऊपर चढ़ेगा।']
: ['માટી કોઈ નક્કર ટુકડો નથી, પણ કણો અને તેમની વચ્ચેની જગ્યાઓની ભુલભુલામણી છે.','કેશિકા ક્રિયા ગુરુત્વાકર્ષણની વિરુદ્ધ માટીના સાંકડા છિદ્રોમાંથી પાણીને ઉપર તરફ ખેંચે છે, જેનાથી શુષ્ક સમયગાળા દરમિયાન છોડના મૂળને પાણી મળે છે.','છિદ્રો જેટલા ઝીણા, પાણી એટલું ઊંચે ચઢે.'];
const paras = EN.map((en,i) => { const lensOn = m === 'lens' && i === this.state.at;
return { en, tr: TR[i],
showEn: m === 'split' || (m === 'lens' && !lensOn), showTr: m !== 'lens' || lensOn,
enSize: m === 'split' ? '15px' : '18px', enO: m === 'split' ? 0.65 : 1,
lensBg: lensOn ? 'linear-gradient(135deg,#E6FFF8,#F2FFE0)' : 'transparent', pad: lensOn ? '14px 16px' : '0',
ring: lensOn ? '0 0 0 3px #3DF5D0, 0 0 28px rgba(61,245,208,0.6)' : 'none',
mark: m === 'split' ? '3px solid #3DF5D0' : '0', mpad: m === 'split' ? '10px' : '0',
pick: () => this.setState({ at:i, mode: m === 'full' ? 'full' : m }) }; });
const seg = (v,l) => ({ l, on: m === v ? 'true':'false', bg: m === v ? '#F4F1FF':'transparent', fg: m === v ? '#04161A':'#F4F1FF', pick: () => this.setState({ mode:v }) });
return { paras, lang: hi ? 'hi':'gu', trFont: hi ? "'Noto Serif Devanagari',serif" : "'Noto Serif Gujarati',serif",
langLabel: hi ? 'हिन्दी' : 'ગુજરાતી', flipLang: () => this.setState({ lang: hi ? 'gu':'hi' }),
modes: [seg('lens','Lens'), seg('split','Split'), seg('full', hi ? 'All हिन्दी' : 'All ગુજરાતી')] };
}
}
</script>
</body>
</html>
