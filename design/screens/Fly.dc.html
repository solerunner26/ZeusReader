<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fly through the book</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Literata:opsz,wght@7..72,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes twinkle{0%,100%{opacity:.4}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:linear-gradient(165deg,#120B2E,#3A1C8C);color:#F4F1FF;font-family:'Bricolage Grotesque',sans-serif">
<div aria-hidden="true" style="position:absolute;width:340px;height:340px;left:-150px;top:240px;border-radius:50%;background:#7C5CFF;filter:blur(90px);opacity:0.6"></div>

<div style="position:absolute;left:24px;top:30px;display:flex;flex-direction:column;gap:4px">
<span style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.18em;opacity:0.75">FLYING THROUGH</span>
<span style="font-family:'Unbounded',sans-serif;font-weight:900;font-size:76px;line-height:0.9">112</span>
<span style="font-family:'JetBrains Mono',monospace;font-size:12px;opacity:0.75">of 312 · 36%</span>
</div>

<div aria-hidden="true" style="position:absolute;right:58px;top:120px;bottom:120px;width:2px;background:linear-gradient(180deg,rgba(255,255,255,0.05),rgba(255,255,255,0.4),rgba(255,255,255,0.05))"></div>
<ol aria-label="Chapters" style="position:absolute;right:46px;top:120px;bottom:120px;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end">
<sc-for list="{{chapters}}" as="c" hint-placeholder-count="8">
<li style="display:flex;align-items:center;gap:12px;flex-direction:row-reverse">
<span style="width:{{c.size}};height:{{c.size}};border-radius:50%;background:{{c.bg}};box-shadow:{{c.shadow}};display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-weight:800;font-size:{{c.fs}};color:#120B2E;margin-right:{{c.mr}}">{{c.n}}</span>
<span style="font-family:'Unbounded',sans-serif;font-weight:{{c.w}};font-size:{{c.ts}};opacity:{{c.o}};text-align:right;max-width:200px">{{c.t}}</span>
</li>
</sc-for>
</ol>

<div style="position:absolute;left:20px;width:176px;top:168px;border-radius:24px;padding:14px 16px;background:#F6F4FF;color:#17142B;display:flex;flex-direction:column;gap:8px;box-shadow:0 20px 40px rgba(0,0,0,0.4)">
<span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#5B5675">PREVIEW · p.112</span>
<span style="font-family:'Literata',serif;font-size:14px;line-height:1.5">Roots do not simply sit in the soil; they reshape it. Each root tip leaks sugars that feed…</span>
<span style="align-self:flex-start;height:26px;padding:0 10px;border-radius:13px;background:#FF4FD8;color:#120B2E;font-weight:800;font-size:12px;line-height:26px">2 sparks in here</span>
</div>

<div style="position:absolute;left:24px;right:24px;bottom:28px;display:flex;justify-content:space-between;font-size:13px;font-weight:600;opacity:0.85"><span>let go to land</span><span>slide off to cancel</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const C = ['What soil is','Grains','Life below','Water in soil','Roots','Weather','Healing land','Field work'];
const cur = 4;
return { chapters: C.map((t,i) => { const d = Math.abs(i - cur); const on = i === cur;
const size = on ? 64 : (d === 1 ? 34 : 24);
return { n: i + 1, t, size: size + 'px', fs: on ? '22px' : '11px', ts: on ? '20px' : (d === 1 ? '14px' : '12px'), w: on ? 900 : 400, o: on ? 1 : (d === 1 ? 0.8 : 0.5),
bg: on ? 'radial-gradient(circle at 35% 30%,#FFFFFF,#FFE14D 34%,#7C5CFF 100%)' : (i === 3 ? '#FF4FD8' : 'rgba(255,255,255,0.75)'),
shadow: on ? '0 0 40px 8px #7C5CFF' : 'none', mr: on ? '-20px' : (size === 34 ? '-4px' : '1px') }; }) };
}
}
</script>
</body>
</html>
