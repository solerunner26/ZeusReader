<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Passages — folders and saved passages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:{{bg}};color:{{ink}};font-family:'Atkinson Hyperlegible',sans-serif">
<div aria-hidden="true" style="position:absolute;inset:0;background:{{aura}}"></div>
<div style="position:relative;padding:20px 16px 0;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:center;justify-content:space-between;padding:0 4px"><h1 style="margin:0;font-family:'Fraunces',serif;font-weight:500;font-size:32px">Passages</h1><span style="font-size:13px;color:{{inkSoft}}">{{count}} saved</span></div>
<label style="display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-radius:26px;background:{{paper}};border:1px solid {{line}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><input placeholder="Search words, books, notes" style="flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:14px;color:{{ink}};outline:none"></label>

<div aria-label="Folders" style="display:flex;gap:10px;overflow:hidden">
<div style="flex:none;width:150px;height:112px;border-radius:24px;background:{{hue}};color:{{onHue}};padding:14px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3z"></path></svg><div><div style="font-weight:700;font-size:15px">Soil science</div><div style="font-size:12px;opacity:0.85">9 passages</div></div></div>
<div style="flex:none;width:120px;height:112px;border-radius:24px;background:{{hueSoft}};padding:14px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3z"></path></svg><div><div style="font-weight:700;font-size:15px">Exam quotes</div><div style="font-size:12px;color:{{inkSoft}}">14</div></div></div>
<div style="flex:none;width:90px;height:112px;border-radius:24px;background:{{paper}};border:1px solid {{line}};padding:14px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3z"></path></svg><div style="font-weight:700;font-size:14px">To share</div></div>
</div>

<div role="group" aria-label="Sort" style="display:flex;gap:4px;padding:4px;border-radius:999px;background:{{paper}};border:1px solid {{line}}">
<button style="flex:1;height:40px;border:0;border-radius:999px;background:{{ink}};color:{{paper}};font:inherit;font-size:13px;font-weight:700">Recent</button>
<button style="flex:1;height:40px;border:0;border-radius:999px;background:transparent;color:{{ink}};font:inherit;font-size:13px">By book</button>
<button style="flex:1;height:40px;border:0;border-radius:999px;background:transparent;color:{{ink}};font:inherit;font-size:13px">Shared</button>
</div>

<div style="display:flex;flex-direction:column;gap:10px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="3">
<article style="border-radius:20px;background:{{paper}};border:1px solid {{line}};padding:14px 8px 10px 16px;display:flex;gap:8px">
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">
<p style="margin:0;font-family:'Fraunces',serif;font-style:italic;font-size:16px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{it.q}}</p>
<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:{{inkSoft}};min-width:0"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{it.src}}</span><span style="flex:none;padding:2px 8px;border-radius:8px;background:{{hueSoft}};color:{{hueText}};font-weight:700">{{it.f}}</span></div>
</div>
<div style="display:flex;flex-direction:column">
<button aria-label="Share as card" style="width:44px;height:44px;border:0;border-radius:22px;background:transparent;color:{{hueText}};display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M8 15l3-3 2 2 3-3"></path></svg></button>
<button onClick="{{it.del}}" aria-label="Delete passage" style="width:44px;height:44px;border:0;border-radius:22px;background:transparent;color:{{inkSoft}};display:flex;align-items:center;justify-content:center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
</div>
</article>
</sc-for>
</div>
</div>

<sc-if value="{{undoShown}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position:absolute;left:16px;right:16px;bottom:96px;min-height:52px;border-radius:14px;background:{{ink}};color:{{paper}};display:flex;align-items:center;gap:8px;padding:0 6px 0 16px;font-size:14px"><span style="flex:1">Passage deleted</span><button onClick="{{undo}}" style="height:44px;padding:0 14px;border:0;border-radius:12px;background:transparent;color:{{hueOnInk}};font:inherit;font-size:14px;font-weight:700">Undo</button></div>
</sc-if>

<button aria-label="New passage or folder" style="position:absolute;right:20px;bottom:24px;height:60px;padding:0 22px;border:0;border-radius:20px;background:{{hue}};color:{{onHue}};font:inherit;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 8px 20px rgba(0,0,0,0.18)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"hue":{"editor":"range","min":0,"max":359,"step":1,"unit":"°","default":250},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { gone: [], last: null }; }
renderVals() {
const h = this.props.hue ?? 250;
const all = [
{id:1,q:'“Capillary action draws water upward through narrow soil pores against gravity.”',src:'Soil Science for Beginners · R. Mehta · p. 84',f:'Soil science'},
{id:2,q:'“Clay holds water close to the roots for longer.”',src:'Soil Science for Beginners · R. Mehta · p. 85',f:'Exam quotes'},
{id:3,q:'“Every gram of healthy soil is a city of living things.”',src:'Life Underground · A. Rao · p. 12',f:'To share'}
];
const items = all.filter(x => !this.state.gone.includes(x.id)).map(x => ({...x, del: () => this.setState({ gone:[...this.state.gone, x.id], last:x.id })}));
return {
bg:`hsl(${h},28%,95%)`, paper:`hsl(${h},30%,98%)`, ink:`hsl(${h},32%,13%)`, inkSoft:`hsl(${h},14%,34%)`, hue:`hsl(${h},52%,38%)`, hueText:`hsl(${h},55%,32%)`, onHue:'#FFFFFF', hueSoft:`hsl(${h},45%,90%)`, line:`hsl(${h},20%,86%)`, hueOnInk:`hsl(${h},70%,82%)`,
aura:`radial-gradient(70% 40% at 0% 0%, hsla(${h},75%,78%,0.6), transparent 70%), radial-gradient(60% 35% at 100% 30%, hsla(${h+16},70%,84%,0.5), transparent 70%)`,
count: 32 - this.state.gone.length, items,
undoShown: this.state.last !== null,
undo: () => this.setState({ gone: this.state.gone.filter(g => g !== this.state.last), last:null })
};
}
}
</script>
</body>
</html>
