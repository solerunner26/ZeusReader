<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card studio — share passage as image</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:{{bg}};color:{{ink}};font-family:'Atkinson Hyperlegible',sans-serif;display:flex;flex-direction:column">
<div style="display:flex;align-items:center;gap:4px;padding:12px 12px 0">
<button aria-label="Close card studio" style="width:48px;height:48px;border:0;border-radius:24px;background:transparent;color:{{ink}};display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<span style="flex:1;font-size:17px;font-weight:700">Card studio</span>
<span style="font-size:12px;color:{{inkSoft}};padding-right:8px">{{px}}</span>
</div>

<div style="height:400px;flex:none;display:flex;align-items:center;justify-content:center">
<div role="img" aria-label="Preview of passage card" style="width:{{cw}};height:{{ch}};border-radius:18px;overflow:hidden;position:relative;box-shadow:0 18px 40px rgba(0,0,0,0.25);background:{{cardBg}}">
<sc-if value="{{isCover}}" hint-placeholder-val="{{ true }}">
<div aria-hidden="true" style="position:absolute;inset:-30px;background:linear-gradient(160deg,hsl(140,32%,42%),hsl(140,38%,20%));filter:blur(18px)"><div style="position:absolute;left:30%;top:20%;width:50%;height:30%;background:hsl(42,60%,70%);border-radius:50%"></div><div style="position:absolute;left:10%;bottom:10%;width:80%;height:22%;background:hsl(25,35%,35%)"></div></div>
<div aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.55),rgba(0,0,0,0.68))"></div>
</sc-if>
<div style="position:absolute;inset:0;padding:{{pad}};box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;color:{{cardFg}}">
<svg width="{{qm}}" height="{{qm}}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="opacity:0.9"><path d="M4 18v-5c0-4 2-7 6-8l1 2c-2 1-3 3-3 5h3v6zM13 18v-5c0-4 2-7 6-8l1 2c-2 1-3 3-3 5h3v6z"></path></svg>
<p style="margin:0;font-family:'Fraunces',serif;font-style:italic;font-size:{{fs}};line-height:1.4">Capillary action draws water upward through narrow soil pores against gravity, supplying plant roots during dry intervals.</p>
<div style="display:flex;align-items:center;gap:10px">
<div aria-hidden="true" style="width:{{thumbW}};height:{{thumbH}};flex:none;border-radius:4px;background:linear-gradient(160deg,hsl(140,30%,38%),hsl(140,35%,22%));box-shadow:0 0 0 1px rgba(255,255,255,0.4)"></div>
<div style="display:flex;flex-direction:column;gap:1px;min-width:0"><span style="font-family:'Fraunces',serif;font-weight:600;font-size:{{ms}}">Soil Science for Beginners</span><span style="font-size:{{ss}};opacity:0.85">R. Mehta</span></div>
</div>
</div>
</div>
</div>

<div style="flex:1;border-radius:28px 28px 0 0;background:{{paper}};padding:16px 16px 18px;display:flex;flex-direction:column;gap:12px;border-top:1px solid {{line}}">
<div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:700;color:{{inkSoft}}">Style</span>
<div role="radiogroup" style="display:flex;gap:6px"><sc-for list="{{styles}}" as="s" hint-placeholder-count="3"><button role="radio" aria-checked="{{s.on}}" onClick="{{s.pick}}" style="flex:1;height:44px;border-radius:14px;border:{{s.border}};background:{{s.bg}};color:{{s.fg}};font:inherit;font-size:13px;font-weight:700">{{s.label}}</button></sc-for></div></div>
<div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:700;color:{{inkSoft}}">Size</span>
<div role="radiogroup" style="display:flex;gap:6px"><sc-for list="{{ratios}}" as="r" hint-placeholder-count="3"><button role="radio" aria-checked="{{r.on}}" onClick="{{r.pick}}" style="flex:1;height:44px;border-radius:14px;border:{{r.border}};background:{{r.bg}};color:{{r.fg}};font:inherit;font-size:13px;font-weight:700">{{r.label}}</button></sc-for></div></div>
<div style="display:flex;gap:8px;align-items:center;font-size:13px;color:{{inkSoft}}"><span style="flex:1">Readability check ✓ text ≥ 4.5:1 on any cover</span><span style="padding:4px 10px;border-radius:8px;background:{{hueSoft}};color:{{hueText}};font-weight:700">PNG ▾</span></div>
<div style="margin-top:auto;display:flex;gap:8px">
<button style="flex:1;height:56px;border-radius:18px;border:1px solid {{line}};background:transparent;color:{{ink}};font:inherit;font-size:15px;font-weight:700">Save to gallery</button>
<button style="flex:1.2;height:56px;border-radius:18px;border:0;background:{{hue}};color:{{onHue}};font:inherit;font-size:15px;font-weight:700">Share…</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"hue":{"editor":"range","min":0,"max":359,"step":1,"unit":"°","default":250},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { style:'cover', ratio:'4:5' }; }
renderVals() {
const h = this.props.hue ?? 250;
const C = { bg:`hsl(${h},28%,95%)`, paper:`hsl(${h},30%,98%)`, ink:`hsl(${h},32%,13%)`, inkSoft:`hsl(${h},14%,34%)`, hue:`hsl(${h},52%,38%)`, hueText:`hsl(${h},55%,32%)`, onHue:'#FFFFFF', hueSoft:`hsl(${h},45%,90%)`, line:`hsl(${h},20%,84%)` };
const R = { '1:1':{w:300,h:300,px:'1080 × 1080'}, '4:5':{w:290,h:362,px:'1080 × 1350'}, '9:16':{w:208,h:370,px:'1080 × 1920'} }[this.state.ratio];
const k = R.w / 300;
const st = this.state.style;
const cardBg = st === 'ink' ? `hsl(${h},30%,10%)` : st === 'paper' ? `hsl(${h},30%,96%)` : '#000';
const cardFg = st === 'paper' ? `hsl(${h},32%,12%)` : '#FFFFFF';
const sel = (on) => ({ border: on ? `2px solid ${C.ink}` : `1px solid ${C.line}`, bg: on ? C.ink : 'transparent', fg: on ? C.paper : C.ink, on: on ? 'true' : 'false' });
return { ...C, px: R.px, cw: R.w + 'px', ch: R.h + 'px', pad: Math.round(26 * k) + 'px', fs: Math.round(19 * k) + 'px', ms: Math.round(14 * k) + 'px', ss: Math.round(12 * k) + 'px', qm: Math.round(26 * k), thumbW: Math.round(28 * k) + 'px', thumbH: Math.round(40 * k) + 'px',
isCover: st === 'cover', cardBg, cardFg,
styles: [['cover','Cover blur'],['ink','Ink'],['paper','Paper']].map(([v,l]) => ({ label:l, ...sel(st === v), pick: () => this.setState({ style:v }) })),
ratios: [['1:1','Square'],['4:5','Post 4:5'],['9:16','Story 9:16']].map(([v,l]) => ({ label:l, ...sel(this.state.ratio === v), pick: () => this.setState({ ratio:v }) })) };
}
}
</script>
</body>
</html>
