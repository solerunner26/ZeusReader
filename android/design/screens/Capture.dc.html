<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spark a passage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Literata:opsz,wght@7..72,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes pop{from{transform:translateY(10px) scale(.8);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:linear-gradient(165deg,#120B2E,#3A1C8C);font-family:'Bricolage Grotesque',sans-serif;color:#F4F1FF">
<div style="position:absolute;left:8px;right:8px;top:30px;bottom:8px;border-radius:30px;background:#F6F4FF;color:#17142B;overflow:hidden">
<div style="position:absolute;left:26px;right:26px;top:100px;display:flex;flex-direction:column;gap:14px">
<p style="margin:0;font-family:'Literata',serif;font-size:18px;line-height:1.7;opacity:0.45">Soil is not a solid block but a maze of particles and the spaces between them.</p>
<p style="margin:0;font-family:'Literata',serif;font-size:18px;line-height:1.7"><span style="background:linear-gradient(90deg,#7C5CFF40,#FF4FD840);border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:2px 3px">Capillary action draws water upward through narrow soil pores against gravity, supplying plant roots during dry intervals.</span></p>
</div>
<div role="toolbar" aria-label="Selection" style="position:absolute;left:18px;right:18px;top:26px;height:60px;border-radius:30px;background:#120B2E;display:flex;align-items:center;gap:2px;padding:0 6px;animation:pop .35s cubic-bezier(.2,1.4,.4,1) both;box-shadow:0 14px 30px rgba(18,11,46,0.35)">
<button style="height:48px;padding:0 18px;border-radius:24px;border:0;background:linear-gradient(135deg,#FFE14D,#FF4FD8);color:#120B2E;font:inherit;font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"></path></svg>Spark it</button>
<button style="flex:1;height:48px;border:0;border-radius:24px;background:transparent;color:#F4F1FF;font:inherit;font-weight:600;font-size:13px">Glow</button>
<button style="flex:1;height:48px;border:0;border-radius:24px;background:transparent;color:#F4F1FF;font:inherit;font-weight:600;font-size:13px">Lens</button>
<button style="flex:1;height:48px;border:0;border-radius:24px;background:transparent;color:#F4F1FF;font:inherit;font-weight:600;font-size:13px">Card</button>
<button aria-label="More: zap word, copy" style="width:44px;height:48px;border:0;border-radius:24px;background:transparent;color:#F4F1FF;font-size:18px">⋯</button>
</div>
</div>

<section aria-label="Choose a constellation" style="position:absolute;left:0;right:0;bottom:0;height:450px;border-radius:34px 34px 0 0;background:rgba(14,10,34,0.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,0.2);padding:14px 20px 22px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px">
<div style="align-self:center;width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,0.35)"></div>
<span style="font-family:'Unbounded',sans-serif;font-weight:900;font-size:22px">Add to a constellation</span>
<div role="radiogroup" aria-label="Constellation" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<sc-for list="{{cons}}" as="c" hint-placeholder-count="3">
<button role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="height:96px;border-radius:24px;border:{{c.ring}};background:{{c.bg}};color:#F4F1FF;position:relative;overflow:hidden;text-align:left;padding:12px 14px;display:flex;flex-direction:column;justify-content:flex-end">
<span aria-hidden="true" style="position:absolute;left:18px;top:14px;width:5px;height:5px;border-radius:3px;background:#fff;box-shadow:24px 8px 0 #fff,52px -2px 0 #fff,80px 12px 0 #fff,40px 26px 0 #fff"></span>
<span style="font-family:'Unbounded',sans-serif;font-weight:800;font-size:15px">{{c.n}}</span><span style="font-size:12px;opacity:0.8">{{c.k}} sparks</span>
</button>
</sc-for>
<button style="height:96px;border-radius:24px;border:2px dashed rgba(255,255,255,0.35);background:transparent;color:#F4F1FF;font:inherit;font-weight:800;font-size:15px">+ New constellation</button>
</div>
<label style="height:52px;border-radius:26px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);display:flex;align-items:center;padding:0 18px"><input value="for the ch 4 summary" aria-label="Note" style="flex:1;border:0;background:transparent;color:#F4F1FF;font:inherit;font-size:15px;outline:none"></label>
<button style="margin-top:auto;height:62px;border-radius:31px;border:0;background:linear-gradient(135deg,#FFE14D,#FF4FD8);color:#120B2E;font:inherit;font-weight:800;font-size:18px;box-shadow:0 14px 30px -10px #FF4FD8">Spark it into {{picked}}</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { pick:'Soil science' }; }
renderVals() {
const C = [['Soil science',9,'linear-gradient(140deg,#2E7D5F,#0C4A4A)'],['Exam fuel',14,'linear-gradient(140deg,#7C5CFF,#3A1C8C)'],['Post-worthy',5,'linear-gradient(140deg,#FF4FD8,#5B1240)']];
return { picked: this.state.pick, cons: C.map(([n,k,bg]) => ({ n, k, bg, on: n === this.state.pick ? 'true':'false', ring: n === this.state.pick ? '3px solid #FFE14D' : '1px solid rgba(255,255,255,0.2)', pick: () => this.setState({ pick:n }) })) };
}
}
</script>
</body>
</html>
