<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Listen — karaoke read-aloud</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes fa{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,30px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:linear-gradient(165deg,#1E0A16,#5B1240);color:#F4F1FF;font-family:'Bricolage Grotesque',sans-serif">
<div aria-hidden="true" style="position:absolute;width:360px;height:360px;left:-100px;top:120px;border-radius:50%;background:#FF4FD8;filter:blur(90px);opacity:0.55;animation:fa 14s ease-in-out infinite"></div>
<div aria-hidden="true" style="position:absolute;width:300px;height:300px;right:-120px;bottom:60px;border-radius:50%;background:#FF9A3D;filter:blur(90px);opacity:0.5"></div>

<div style="position:relative;padding:24px 22px 0;display:flex;flex-direction:column;gap:24px">
<div style="display:flex;align-items:center;gap:12px">
<span aria-hidden="true" style="width:44px;height:64px;border-radius:6px;background:linear-gradient(160deg,#6F936B,#2F4A33);box-shadow:0 8px 20px rgba(0,0,0,0.4)"></span>
<div style="flex:1;display:flex;flex-direction:column"><span style="font-family:'JetBrains Mono',monospace;font-size:11px;opacity:0.75">NOW READING ALOUD · CH 4</span><span style="font-family:'Unbounded',sans-serif;font-weight:800;font-size:16px">Soil Science for Beginners</span></div>
</div>

<p aria-live="polite" style="margin:0;font-family:'Literata',serif;font-weight:600;font-size:28px;line-height:1.45"><span style="color:#F4F1FF">Capillary action draws water upward through narrow </span><span style="background:linear-gradient(135deg,#FFB23D,#FF4FD8);color:#1E0A16;border-radius:10px;padding:0 6px">soil</span><span style="color:rgba(244,241,255,0.45)"> pores against gravity, supplying plant roots during dry intervals.</span></p>

<div role="img" aria-label="Voice waveform" style="height:64px;display:flex;align-items:center;gap:4px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="34"><span style="flex:1;height:{{b.h}};border-radius:3px;background:{{b.c}};animation:eq {{b.t}} ease-in-out infinite;transform-origin:center"></span></sc-for>
</div>

<div style="display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:11px;opacity:0.8"><span>p.84 · 4:12</span><span>chapter left 11:40</span></div>
</div>

<div style="position:absolute;left:22px;right:22px;bottom:30px;display:flex;flex-direction:column;gap:18px">
<div style="display:flex;align-items:center;justify-content:space-between">
<button aria-label="Back 15 seconds" style="width:60px;height:60px;border-radius:30px;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.08);color:#F4F1FF;font-family:'Unbounded',sans-serif;font-weight:800;font-size:14px">-15</button>
<button aria-label="Pause" style="width:96px;height:96px;border-radius:48px;border:0;background:radial-gradient(circle at 35% 30%,#FFFFFF,#FFB23D 35%,#FF4FD8);color:#1E0A16;display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(255,79,216,0.6)"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4.5" height="16" rx="1.5"></rect><rect x="13.5" y="4" width="4.5" height="16" rx="1.5"></rect></svg></button>
<button aria-label="Forward 15 seconds" style="width:60px;height:60px;border-radius:30px;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.08);color:#F4F1FF;font-family:'Unbounded',sans-serif;font-weight:800;font-size:14px">+15</button>
</div>
<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
<button style="height:44px;padding:0 16px;border-radius:22px;border:0;background:#F4F1FF;color:#1E0A16;font:inherit;font-weight:800;font-size:14px">1.25×</button>
<button style="height:44px;padding:0 16px;border-radius:22px;border:1px solid rgba(255,255,255,0.3);background:transparent;color:#F4F1FF;font:inherit;font-weight:800;font-size:14px">Voice: English</button>
<button style="height:44px;padding:0 16px;border-radius:22px;border:1px solid rgba(255,255,255,0.3);background:transparent;color:#F4F1FF;font:inherit;font-weight:800;font-size:14px">Sleep in 20m</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const bars = Array.from({length:34}, (_, i) => { const h = 18 + Math.round(Math.abs(Math.sin(i * 0.9)) * 44); return { h: h + 'px', t: (0.7 + (i % 5) * 0.15).toFixed(2) + 's', c: i < 14 ? '#FFB23D' : 'rgba(244,241,255,0.4)' }; });
return { bars };
}
}
</script>
</body>
</html>
