<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scanned page with OCR</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Literata:opsz,wght@7..72,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes beam{0%{top:0}100%{top:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:linear-gradient(165deg,#180806,#5A1A0C);color:#F4F1FF;font-family:'Bricolage Grotesque',sans-serif">
<div aria-hidden="true" style="position:absolute;width:320px;height:320px;left:-120px;top:-80px;border-radius:50%;background:#FF5A36;filter:blur(90px);opacity:0.55"></div>
<div style="position:absolute;left:18px;right:18px;top:20px;display:flex;justify-content:space-between;align-items:center"><span style="font-family:'Unbounded',sans-serif;font-weight:800;font-size:16px">Scanned page</span><span style="font-family:'JetBrains Mono',monospace;font-size:11px;opacity:0.8">MARGINS CROPPED · 140%</span></div>

<div style="position:absolute;left:14px;right:14px;top:60px;height:330px;border-radius:24px;background:#E9E2D2;overflow:hidden;padding:20px 18px;box-sizing:border-box;display:flex;gap:14px">
<div aria-hidden="true" style="position:absolute;left:0;right:0;height:3px;background:#FFC24D;box-shadow:0 0 18px 4px #FF5A36;animation:beam 2.8s linear infinite alternate"></div>
<div style="flex:1;display:flex;flex-direction:column;gap:7px">
<div style="height:10px;width:66%;background:#8A8276;border-radius:2px"></div>
<div style="height:6px;background:#A79F92;border-radius:2px"></div><div style="height:6px;background:#A79F92;border-radius:2px"></div><div style="height:6px;width:88%;background:#A79F92;border-radius:2px"></div>
<div style="display:flex;flex-direction:column;gap:7px;padding:8px;margin:0 -8px;border-radius:10px;box-shadow:0 0 0 3px #FFC24D,0 0 20px rgba(255,90,54,0.6);background:rgba(255,194,77,0.18)"><div style="height:6px;background:#4A433B;border-radius:2px"></div><div style="height:6px;background:#4A433B;border-radius:2px"></div><div style="height:6px;width:60%;background:#4A433B;border-radius:2px"></div></div>
<div style="height:6px;background:#A79F92;border-radius:2px"></div><div style="height:6px;width:80%;background:#A79F92;border-radius:2px"></div><div style="height:6px;background:#A79F92;border-radius:2px"></div>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:7px">
<div aria-hidden="true" style="height:96px;border:1px solid #A79F92;border-radius:4px;display:flex;align-items:flex-end;justify-content:space-around;padding:6px;box-sizing:border-box"><span style="width:4px;height:70px;background:#6F8BA6"></span><span style="width:9px;height:42px;background:#6F8BA6"></span><span style="width:16px;height:18px;background:#6F8BA6"></span></div>
<div style="height:6px;background:#A79F92;border-radius:2px"></div><div style="height:6px;background:#A79F92;border-radius:2px"></div><div style="height:6px;width:64%;background:#A79F92;border-radius:2px"></div>
</div>
<span style="position:absolute;right:12px;bottom:12px;height:28px;padding:0 10px;border-radius:14px;background:#180806;color:#FFC24D;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:28px">2 COLUMNS · L → R</span>
</div>

<section aria-label="Text read from the scan" style="position:absolute;left:10px;right:10px;bottom:10px;height:420px;border-radius:32px;background:rgba(24,8,6,0.78);border:1px solid rgba(255,255,255,0.18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:18px 18px 18px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:12px">
<div role="img" aria-label="78 percent sure" style="width:58px;height:58px;border-radius:29px;background:conic-gradient(#FFC24D 0 78%,rgba(255,255,255,0.15) 78% 100%);display:flex;align-items:center;justify-content:center"><span style="width:44px;height:44px;border-radius:22px;background:#2A0E08;display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-weight:800;font-size:13px">78%</span></div>
<div style="flex:1;display:flex;flex-direction:column"><span style="font-family:'Unbounded',sans-serif;font-weight:800;font-size:16px">Mostly sure</span><span style="font-size:13px;opacity:0.8">2 words look blurry — tap to fix</span></div>
<button style="height:40px;padding:0 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.3);background:transparent;color:#F4F1FF;font:inherit;font-weight:800;font-size:12px">See scan</button>
</div>
<p style="margin:0;font-family:'Literata',serif;font-size:17px;line-height:1.6;border-radius:18px;padding:12px 14px;background:#F6F4FF;color:#17142B">Capillary action draws water upward through narrow soil <span style="border-bottom:3px dotted #FF5A36">pores</span> against gravity, supplying plant roots during dry <span style="border-bottom:3px dotted #FF5A36">intervals</span>.</p>
<div style="margin-top:auto;display:flex;gap:8px">
<button style="flex:1;height:54px;border-radius:27px;border:1px solid rgba(255,255,255,0.3);background:transparent;color:#F4F1FF;font:inherit;font-weight:800;font-size:14px">Lens it</button>
<button style="flex:1;height:54px;border-radius:27px;border:0;background:linear-gradient(135deg,#FFC24D,#FF5A36);color:#180806;font:inherit;font-weight:800;font-size:15px">Spark it</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
