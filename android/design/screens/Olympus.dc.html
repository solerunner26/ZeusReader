<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Olympus — your library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:linear-gradient(165deg,{{a}},{{b}});color:#F4F1FF;font-family:'Bricolage Grotesque',sans-serif">
<div aria-hidden="true" style="position:absolute;width:360px;height:360px;left:15px;top:60px;border-radius:50%;background:{{glow}};filter:blur(90px);opacity:0.55;transition:background .4s"></div>
<div style="position:relative;padding:20px 18px 0;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:center;gap:10px">
<div style="flex:1;display:flex;flex-direction:column"><h1 style="margin:0;font-family:'Unbounded',sans-serif;font-weight:900;font-size:34px;line-height:1">Olympus</h1><span style="font-size:13px;opacity:0.75">128 books on your mountain</span></div>
<button aria-label="Bring in books" style="width:52px;height:52px;border-radius:26px;border:0;background:radial-gradient(circle at 35% 30%,#FFFFFF,#FFE14D 35%,#FF4FD8);color:#120B2E;display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px rgba(255,79,216,0.6)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<label style="height:52px;border-radius:26px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.22);display:flex;align-items:center;gap:10px;padding:0 18px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><input placeholder="“short history books I haven’t finished”" style="flex:1;min-width:0;border:0;background:transparent;color:#F4F1FF;font:inherit;font-size:14px;outline:none"></label>

<div aria-label="Currently reading" style="position:relative;height:250px">
<sc-for list="{{flow}}" as="f" hint-placeholder-count="3">
<button onClick="{{f.pick}}" aria-label="{{f.t}}" style="position:absolute;left:{{f.x}};top:{{f.y}};width:{{f.w}};height:{{f.h}};border:0;border-radius:10px;padding:12px;background:{{f.c}};transform:{{f.tf}};z-index:{{f.z}};box-shadow:{{f.sh}};display:flex;flex-direction:column;justify-content:flex-end;text-align:left;color:#F4F1FF;transition:all .35s cubic-bezier(.2,1,.3,1)"><span style="font-family:'Unbounded',sans-serif;font-weight:800;font-size:{{f.fs}};line-height:1.1">{{f.t}}</span></button>
</sc-for>
</div>
<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-family:'Unbounded',sans-serif;font-weight:800;font-size:16px">{{cur.t}}</span><span style="height:30px;padding:0 10px;border-radius:15px;background:#FFE14D;color:#120B2E;font-weight:800;font-size:12px;line-height:30px">{{cur.p}} read</span></div>

<div aria-label="Filters" style="display:flex;flex-wrap:wrap;gap:8px">
<button style="height:38px;padding:0 14px;border-radius:12px;border:0;background:#F4F1FF;color:#120B2E;font:inherit;font-weight:800;font-size:13px;transform:rotate(-2deg)">Reading 3</button>
<button style="height:38px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.3);background:transparent;color:#F4F1FF;font:inherit;font-weight:800;font-size:13px">EPUB · PDF</button>
<button style="height:38px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.3);background:transparent;color:#F4F1FF;font:inherit;font-weight:800;font-size:13px">Year</button>
<button style="height:38px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.3);background:transparent;color:#F4F1FF;font:inherit;font-weight:800;font-size:13px">Genre</button>
<button style="height:38px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.3);background:transparent;color:#F4F1FF;font:inherit;font-weight:800;font-size:13px">Author</button>
<button style="height:38px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.3);background:transparent;color:#F4F1FF;font:inherit;font-weight:800;font-size:13px">Pages</button>
<button style="height:38px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.3);background:transparent;color:#F4F1FF;font:inherit;font-weight:800;font-size:13px">Language</button>
</div>
<a href="Book.dc.html" style="height:48px;border-radius:24px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px">Open {{cur.t}} details →</a>
</div>

<nav aria-label="Main" style="position:absolute;left:16px;right:16px;bottom:16px;height:68px;border-radius:34px;background:rgba(18,11,46,0.6);border:1px solid rgba(255,255,255,0.18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0 6px">
<a href="Home.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"></path></svg>Home</a>
<a href="Olympus.dc.html" aria-current="page" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:800;color:#FFE14D"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM15.5 5l3.8-1 2.7 15-3.8 1z"></path></svg>Olympus</a>
<a href="SparksHome.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"></path></svg>Sparks</a>
<a href="Words.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600"><span style="font-family:'Unbounded',sans-serif;font-weight:800;font-size:17px;line-height:22px">अ</span>Words</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { i:1 }; }
renderVals() {
const B = [
{t:'Organic Chemistry Notes',c:'linear-gradient(160deg,#B0563E,#4E2418)',p:'12%',a:'#1E0A16',b:'#5B1240',glow:'#FF5A36'},
{t:'Soil Science for Beginners',c:'linear-gradient(160deg,#6F936B,#2F4A33)',p:'37%',a:'#04161A',b:'#0C4A4A',glow:'#3DF5D0'},
{t:'Physics, Volume Two',c:'linear-gradient(160deg,#4A6C96,#1B2A3C)',p:'64%',a:'#06101F',b:'#10306B',glow:'#3D8BFF'}
];
const i = this.state.i, cur = B[i];
const flow = B.map((b,j) => { const d = j - i; const on = d === 0;
return { t:b.t, c:b.c, pick: () => this.setState({ i:j }), w: on ? '150px' : '112px', h: on ? '222px' : '166px', fs: on ? '16px' : '12px',
x: (on ? 102 : (d < 0 ? 0 : 242)) + 'px', y: on ? '10px' : '42px', z: on ? 3 : 1,
tf: on ? 'none' : (d < 0 ? 'perspective(600px) rotateY(32deg)' : 'perspective(600px) rotateY(-32deg)'),
sh: on ? '0 24px 50px rgba(0,0,0,0.55)' : '0 12px 24px rgba(0,0,0,0.4)' }; });
return { flow, cur, a:cur.a, b:cur.b, glow:cur.glow };
}
}
</script>
</body>
</html>
